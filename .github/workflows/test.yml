name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.nvim-data

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: MunifTanjim/setup-neovim-action@v1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install test dependencies
        run: |
          mkdir -p "$XDG_DATA_HOME/nvim/lazy"
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim.git \
            "$XDG_DATA_HOME/nvim/lazy/plenary.nvim"
          git clone --depth 1 https://github.com/hedyhli/outline.nvim.git \
            "$XDG_DATA_HOME/nvim/lazy/outline.nvim"
          git clone --depth 1 https://github.com/goerz/jupytext.nvim.git \
            "$XDG_DATA_HOME/nvim/lazy/jupytext.nvim"
          git clone --depth 1 https://github.com/echasnovski/mini.diff.git \
            "$XDG_DATA_HOME/nvim/lazy/mini.diff"
          git clone --depth 1 https://github.com/nvzone/menu.git \
            "$XDG_DATA_HOME/nvim/lazy/menu"
          git clone --depth 1 https://github.com/nvzone/volt.git \
            "$XDG_DATA_HOME/nvim/lazy/volt"
          uv tool install jupytext

      - name: Run tests
        run: tests/run.sh
